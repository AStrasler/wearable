name: Linux archive containment regressions

on:
  push:
    branches:
      - codex/jira-archive-containment-20261110

permissions: {}

jobs:
  archive-path-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.0.4
        with:
          python-version: "3.11"
      - name: Install ingest test dependencies
        run: python -m pip install --disable-pip-version-check -r server/ingest/requirements-dev.txt
      - name: Install the local WHOOP protocol package
        run: python -m pip install --disable-pip-version-check ./server/packages/whoop-protocol
      - name: Run archive and read containment regressions
        working-directory: server/ingest
        run: >-
          python -m pytest -q
          tests/test_archive_path_security.py
          tests/test_archive.py
          tests/test_read.py
